# SPDX-License-Identifier: AGPL-3.0-or-later

[workspace]
resolver = "2"
members = [
    "crates/axys-core",
    "crates/axys-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
authors = ["Neonalig"]
repository = "https://github.com/Neonalig/axys"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midly = { version = "0.5", default-features = false, features = ["std"] }
rustfft = "6"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
