# SPDX-License-Identifier: AGPL-3.0-or-later

[workspace]
resolver = "2"
members = [
    "crates/axys-core",
    "crates/axys-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
authors = ["Neonalig"]
repository = "https://github.com/Neonalig/axys"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
midly = { version = "0.5", default-features = false, features = ["std"] }
rustfft = "6"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# The dev profile builds the wasm the dev server serves, so an unoptimised analysis pass is
# what a contributor measures import against. Optimising the crates keeps a take's analysis in
# the seconds it takes in release while leaving debug assertions and incremental builds on.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
