name: Deploy

# A release is a version tag on main: merge to main, then tag the merge commit, e.g. v1.2.0.
on:
  push:
    tags: ['v*']

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Tag a commit that has been merged to main."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Stamp the release version
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"

      - run: npm run doctor

      - run: npm run check

      - name: Build
        env:
          AXYS_SOURCE_REVISION: ${{ github.sha }}
          AXYS_RELEASE: 'true'
          AXYS_SIGNING_KEY: ${{ secrets.AXYS_SIGNING_KEY }}
        run: npm run build

      - name: Check the Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-cloudflare.mjs

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=axys --branch=main
