<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axys</title>
    <meta name="description" content="Local-first monophonic vocal pitch and timing editor" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />
    <!--
      Inline, so it paints on the first response rather than waiting for the stylesheet the
      module graph pulls in. Starting Axys means compiling a WebAssembly core, and without a
      mark on screen that reads as a page that has not loaded.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0e1116;
        color: #e6edf3;
        font-family: 'Atkinson Hyperlegible Next', system-ui, 'Segoe UI', roboto, sans-serif;
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f6f8fa;
          color: #101820;
        }
      }

      #axys-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #axys-splash[hidden] {
        display: none;
      }

      .axys-splash-mark {
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
      }

      .axys-splash-track {
        width: 180px;
        height: 3px;
        overflow: hidden;
        border-radius: 2px;
        background: currentcolor;
        opacity: 0.18;
      }

      .axys-splash-bar {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #34a4ff;
        animation: axys-splash-slide 1.1s ease-in-out infinite;
      }

      .axys-splash-note {
        font-size: 13px;
        opacity: 0.66;
      }

      @keyframes axys-splash-slide {
        0% {
          transform: translateX(-100%);
        }

        100% {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .axys-splash-bar {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="axys-splash" role="status" aria-live="polite">
      <div class="axys-splash-mark">AXYS</div>
      <div class="axys-splash-track"><div class="axys-splash-bar"></div></div>
      <p class="axys-splash-note">Starting the audio core</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
